version: 2

updates:
  # Drei getrennte Gruppen statt zwei — bewusst abweichend vom Muster in den
  # uebrigen Repos, und zwar aus einem funktionalen Grund: bei einem
  # Gruppen-PR meldet dependabot/fetch-metadata den HOECHSTEN Sprung der
  # Gruppe. Waeren patch und minor zusammen, hiesse die Gruppe "minor" und der
  # Auto-Merge (nur patch) wuerde nie greifen.
  #
  # Nebeneffekt fuer den manuellen Teil: der Patch-PR merged sich selbst, der
  # Minor-PR kommt einzeln und wird richtig angeschaut statt im Sammel-PR
  # mitzulaufen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]
      majors:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
