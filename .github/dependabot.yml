version: 2

updates:
  # App + tooling dependencies (single root pnpm-lock.yaml covers the workspace).
  # Grouped into one PR/week so a solo maintainer reviews upgrades in one pass
  # instead of drowning in per-package noise. Majors are separated out so a
  # breaking bump is never silently folded into a routine group.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      majors:
        update-types: [major]

  # Keep the CI actions themselves patched (SHA-pinned in the workflow; Dependabot
  # bumps the SHA + version comment together). This is the direct defense against
  # a compromised third-party action (cf. the tj-actions tag-retargeting incident).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
